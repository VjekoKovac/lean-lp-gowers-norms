fidelity:
  divergences: >-
    Functions take finite nonnegative values, as in the five source theorems.
    Haar-completion measurability is AEMeasurable with respect to the Borel
    Haar measure. Unconditional inequalities use extended nonnegative
    integrals. Uniform little-o conclusions use tolerance-before-threshold
    quantification. The finite set energy is defined by counting tuples.
    The code and the source use positive integers for the discrete parameter p.
    Section 4 uses a near-extremizer theorem for sharp Young. Lean proves the
    required diagonal case for nonnegative inputs at s=p+d−1≥2. It follows
    Christ’s nonnegative heat-flow localization and proves qualitative local
    compactness by differentiating the normalized Euler map at a Gaussian.
review:
  status: "Independently AI-reviewed; no human statement approval recorded."
  reviewers: ["Separate Codex AI statement reviewer", "Codex AI integration reviewer"]
  notes: "The source, independent statement and proof checks, and their limits are documented in docs/REVIEW.md, docs/YOUNG-STABILITY-REVIEW.md and docs/VERIFICATION.md."
alignment:
  namespace: "LpGowers"
  statements:
    - source: "Theorem 1.1, improved log-convexity"
      lean: "LpGowers.theorem_1_1"
      module: "Solution"
      status: "proved"
      note: "For every d≥2 one ε_d∈(0,1) works for every G without a compact open subgroup: U_d≤(1−ε_d) U_{d−1}^{d/(3d−2)} U_{d+1}^{1−d/(3d−2)}. The proof derives a compact open subgroup from near closure under addition by the alternative argument suggested at the end of §6."
    - source: "Theorem 1.2, Lebesgue estimate and coset stability"
      lean: "LpGowers.theorem_1_2"
      module: "Solution"
      status: "proved"
      note: "For p strictly above the endpoint and finite nonzero Lq input, nearness to equality implies normalized Lq distance tending to zero to the amplitude ‖f‖q/μ(H)^{1/q} on a single coset of a compact open subgroup, uniformly in G and μ."
    - source: "Theorem 1.3, sharp Euclidean inequality and Gaussian stability"
      lean: "LpGowers.theorem_1_3"
      module: "Solution"
      status: "proved"
      note: >-
        Part (a) proves the sharp inequality and characterizes every finite nonzero
        equality case. Part (b) gives Gaussian approximation in relative Lq distance
        with exactly the input norm, uniformly in the input. The formal proof establishes
        the needed diagonal Young stability using heat flow, strong local compactness
        of extremizing sequences, and the equality classification, then applies the
        degree-lowering and power-transfer argument of §4.
    - source: "Theorem 1.4, forward and reverse degree lowering, and near equality"
      lean: "LpGowers.theorem_1_4"
      module: "Solution"
      status: "proved"
      note: "For p≠1 and finite positive norms, near equality in the relevant direction requires one common family of integral-one factors r_j simultaneously approximating normalized (R_d f)^p and every normalized (R_{d−1} f)^{p_i} in L¹, with the i-th factor omitted in the i-th marginal."
    - source: "Theorem 1.5, discrete cubes and critical exponents"
      lean: "LpGowers.theorem_1_5"
      module: "Solution"
      status: "proved"
      note: >-
        Part (a) proves t(d,p,2)=log₂(2^p+2d), q(d,p,2)=2^d p/t. Parts (b) and (c) prove
        d+p−(1+o(1))[(d+p)log₂(d+p)−p log₂p−2d]/(2log₂ n)≤t(d,p,n)≤d+p−c/log₂ n
        with absolute c>0, and t(d,p,n)=[(n−1)log₂(2d)−log₂((n−1)!)]/H(Bin(n−1,1/2))+o(1)
        for fixed n,p as d→∞. The error in this last claim is additive.
acknowledgements: >-
  The proofs reuse Mathlib's product Haar and Lebesgue integration,
  Hölder inequalities, Gaussian integrals, real powers, and finite-set
  combinatorics. docs/SOURCE.md attributes the paper's external mathematical
  ingredients. The checking script is adapted from PalomarTemplate. 
  The Euclidean sharp constant uses Yi Han’s geometric Brascamp–Lieb proof 
  at commit 9155169a5ba8f7db77c01c446430e50c0daceb7d.
