version: "v0.4"
project:
  name: "Estimates for Lᵖ variants of Gowers norms"
  authors: ["Vjekoslav Kovač", "Keith M. Rogers"]
  responsible_maintainers: ["Vjekoslav Kovač"]
  license: "Apache-2.0"
  description: >-
    This Lean development proves Theorems 1.1–1.5 in the introduction to
    arXiv:2609.08916v2. Let G be a
    second-countable locally compact Hausdorff abelian group, μ any Haar
    measure, and f a nonnegative measurable function. Let R_d f(h) be the
    integral over x of the product of f(x+Σ_{i∈S} h_i) over all subsets S
    of {1,…,d}, U(d,p)=‖R_d f‖_p^{1/2^d}, U_d=U(d,1), and q=2^d p/(d+p).
    
    Theorem 1.1 states that for each d≥2 there is ε_d∈(0,1)
    such that whenever G has no compact open subgroup,
    U_d≤(1−ε_d)U_{d−1}^{d/(3d−2)} U_{d+1}^{1−d/(3d−2)}.
    The same ε_d works for every group, Haar normalization, and input.
    
    Theorem 1.2(a) gives, for d≥2 and every finite real
    p≥d/(2^d−1), U(d,p)≤‖f‖_q, including the lower endpoint.
    For p strictly above that endpoint, given η>0 there exists δ>0 depending
    only on d,p,η such that for every 0<ε<δ and every 0<N=‖f‖_q<∞ with
    U(d,p)≥(1−ε)N, there exist a compact open subgroup H and a coset C₀
    of H satisfying ‖f−[N/μ(H)^{1/q}]1_{C₀}‖_q≤ηN.
    
    In Theorem 1.3(a), on ℝⁿ with Lebesgue measure, d≥2, n≥1 and
    1≤p<∞, the least constant in U(d,p)≤C‖f‖_q is
    C=[2^{2d}p^p/(d+p)^{d+p}]^{n/(2^{d+1}p)}. For 0<‖f‖_q<∞,
    equality holds if and only if f agrees almost everywhere with
    c exp(−(x−x₀)ᵀM(x−x₀)), where c>0, x₀∈ℝⁿ, and M is a real
    symmetric positive-definite matrix. Part 1.3(b) proves that for
    each η>0 there exists δ>0
    depending only on d,p,n,η such that U(d,p)≥(1−ε)C‖f‖_q for
    0<ε<δ and 0<‖f‖_q<∞ implies the existence of a Gaussian g with
    ‖g‖_q=‖f‖_q and ‖f−g‖_q≤η‖f‖_q.
    
    For Theorem 1.4(a), for d≥2 write W=∏_i U(d−1,p_i)^{θ_i},
    with finite p_i>0, Σθ_i=1 and (1−1/p)/(d−1)=θ_i(1−2/p_i)
    for every i. Then U(d,p)≤W when 0<p≤1 and every θ_i>0.
    Conversely W≤U(d,p) when 1<p<∞, θ_1>0, the other weights are
    negative, the input is nonzero modulo null sets and all the functionals
    are finite. For p=1 there is equality. In (b), fix these parameters,
    p≠1, and positive finite functionals. For each η>0, one δ>0 works
    over all groups and inputs. If 0<ε<δ and U(d,p)≥(1−ε)W in the forward
    case or W≥(1−ε)U(d,p) in the reverse case, there exist probability
    densities r₁,…,r_d on G. In L¹, normalized (R_d f)^p is within η of
    the product of all r_j, and for every i normalized (R_{d−1} f)^{p_i}
    is within η of the product of all r_j except r_i. Each autocorrelation power is
    divided by its own integral.
    
    For positive integers d≥2, p≥1, n≥2,
    t is the least exponent bounding the (d,p)-cube energy of every nonempty
    A⊆{0,…,n−1}^m by |A|^t, uniformly in m. Write q* for the greatest
    exponent with U(d,p)≤‖f‖_{ℓ^{q*}} on that cube uniformly in m.
    The proof establishes attainment and q*t=2^d p. Part 1.5(a) gives
    t(d,p,2)=log₂(2^p+2d) and q*(d,p,2)=2^d p/t(d,p,2).
    Part 1.5(b) is proved. Let B=((d+p)log₂(d+p)−p log₂p−2d)/2.
    There exists an absolute c>0 such that for every fixed d,p, as n→∞,
    d+p−(1+o_{d,p}(1))B/log₂n≤t(d,p,n)≤d+p−c/log₂n.
    In 1.5(c) let H be the Shannon entropy in bits of Bin(n−1,1/2)
    and M(d)=((n−1)log₂(2d)−log₂((n−1)!))/H. For every fixed n,p and
    η>0, |t(d,p,n)−M(d)|≤η for all sufficiently large d.
